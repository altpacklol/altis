sections:
  - title: "1. Взаимодействие с игроками"
    items:
      - text: "1.1. PvP разрешен только по взаимному согласию игроков. Убийство без согласия запрещено."
        punishment:
          - "Штраф: 32 алмаза."
          - "Возврат всего лута жертве."
          - "При отказе от возврата или рецидиве - бан."
      - text: "1.2. Запрещено гриферить чужие постройки."
        punishment:
          - "Штраф: 64 алмаза."
          - "Возврат постройки в исходное состояние."
          - "При отказе - бан и откат изменений. Если с игроком не удается связаться, бан выдается до проявления инициативы нарушителя."
      - text: "1.3. Запрещено воровать вещи из любых сундуков, включая неприваченные."
        punishment:
          - "Штраф: 32 алмаза ИЛИ исправительные работы на общественных объектах сервера."
          - "Полный возврат украденных вещей владельцу."
  - title: "2. Защита территории и комфорт"
    items:
      - text: "2.1. Запрещено строить слишком близко к чужим территориям без договоренности. Минимальное расстояние - 50 блоков от границы участка соседа."
        punishment:
          - "Обязательный снос постройки за свой счет."
          - "При отказе - принудительный откат администрацией."
      # ... остальные пункты
