sections:
  - title: "1. Взаимодействие с игроками"
    items:
      - text: "1.1. PvP разрешен только по взаимному согласию игроков. Убийство без согласия запрещено."
        punishment:
          - "Штраф: 32 алмаза."
          - "Возврат всего лута жертве."
          - "При отказе от возврата или рецидиве - бан."
      - text: "1.2. Запрещено гриферить чужие постройки."
        punishment:
          - "Штраф: 64 алмаза."
          - "Возврат постройки в исходное состояние."
          - "При отказе - бан и откат изменений. Если с игроком не удается связаться, бан выдается до проявления инициативы нарушителя."
      - text: "1.3. Запрещено воровать вещи из любых сундуков, включая неприваченные."
        punishment:
          - "Штраф: 32 алмаза ИЛИ исправительные работы на общественных объектах сервера."
          - "Полный возврат украденных вещей владельцу."

  - title: "2. Защита территории и комфорт"
    items:
      - text: "2.1. Запрещено строить слишком близко к чужим территориям без договоренности. Минимальное расстояние - 50 блоков от границы участка соседа."
        punishment:
          - "Обязательный снос постройки за свой счет."
          - "При отказе - принудительный откат администрацией."
      - text: "2.2. Запрещено захламление общего пространства. К этому относятся уродливые столбы, брошенные недострои, бессмысленные столбы в небо рядом со спавном."
        punishment:
          - "Предупреждение и требование убрать."
          - "При игнорировании - снос с штрафом в 20 алмазов."
      - text: "2.3. Запрещено создание скрытых ловушек (ямы с лавой, кактусы и т.д) в местах общего пользования (спавн, общественные фермы, торговые зоны и т.д)."
        punishment:
          - "Немедленный снос ловушки."
          - "Штраф: 128 алмаза. При нанесении урона игрокам - компенсация пострадавшему."
      - text: "2.4. Запрещено строительство похабщины, нацизма и прочего подобного характера элементов."
        punishment:
          - "Обязательный снос постройки, за счет того кто построил, а так же штраф 128 алмазов"
          - "При отказе - принудительный откат администрацией + бан тому кто построил."

      - text: "2.5. Запрещено создание ловушек любого типа."
        punishment:
          - "Немедленный снос ловушки + Штраф: 128 алмаза."
          - "При рецидиве или отказе сноса - Бан."
      - text: "2.6. Запрещено строительство похабщины, нацизма и прочего подобного характера элементов."
        punishment:
          - "Обязательный снос постройки, за счет того кто построил, а так же штраф 128 алмазов"
          - "При отказе - принудительный откат администрацией + бан тому кто построил."
 

  - title: "3. Чаты и общение"
    items:
      - text: "3.1. Запрещён спам, флуд."
        punishment:
          - "Мут на 1 час."
          - "При рецидиве - мут на 24 часа."
      - text: "3.2. Запрещена реклама других серверов, проектов и сторонних ресурсов."
        punishment:
          - "Перманентный бан без возможности разбана."
      - text: "3.3. Запрещены оскорбления, дискриминация, разжигание ненависти и травля игроков."
        punishment:
          - "Мут на 24 часа."
          - "При серьезном нарушении или рецидиве - перманентный бан."

  - title: "4. Честность игрового процесса"
    items:
      - text: "4.1. Запрещено использование читов, дюпов, эксплойтов и любых сторонних программ, дающих преимущество (X-Ray текстуры и прочие)."
        punishment:
          - "Перманентный бан."
          - "Откат всех действий, совершенных с помощью читов."
      - text: "4.2. Запрещено использование ошибок игры (багов) для получения преимущества."
        punishment:
          - "Откат незаконно полученных предметов/ресурсов."
          - "Предупреждение. При рецидиве - бан на 7 дней."
      - text: "4.3. Запрещено использование твинков/мультиаккаунтство."
        punishment:
          - "Перманентный бан всех твинков."
          - "Если использовался изощренный способ создания твинк аккаунта -> Перманентный бан основного аккаунта"
 


  - title: "5. Социальные нормы и безопасность"
    items:
      - text: "5.1. Запрещено выдавать себя за администратора или модератора сервера."
        punishment:
          - "Перманентный бан."
      - text: "5.2. Запрещены обман и мошенничество: нечестные сделки, продажа «кота в мешке», подмена блоков при обмене."
        punishment:
          - "Отмена сделки и возврат средств/предметов пострадавшему."
          - "Штраф в размере суммы сделки или 64 алмаза."
      - text: "5.3. Запрещено создание конфликтов и травля (буллинг) других игроков, даже без прямых оскорблений."
        punishment:
          - "Мут или бан на усмотрение модерации, в зависимости от тяжести нарушения."
      - text: "5.4. Запрещена публикация личной информации (доксинг) — своей или других игроков."
        punishment:
          - "Перманентный бан без возможности обжалования."
      - text: "5.5. Запрещены оскорбительные, провокационные ники и скины, а также ники, имитирующие администрацию."
        punishment:
          - "Требование сменить никнейм/скин."
          - "При отказе - бан до смены."

  - title: "6. Техника и игровая механика"
    items:
      - text: "6.1. Запрещено создание «точек невозврата»: строительство порталов в опасных местах (над лавой, в воздухе) в Нижнем мире и Энде, где игрок моментально погибает."
        punishment:
          - "Немедленный снос опасного портала."
          - "Штраф: 32 алмаза. Если из-за ловушки погибли игроки - компенсация им."

      - text: "6.2. Запрещено использование багов для проникновения на защищенные территории (например, жемчуг Эндера через преграду)."
        punishment:
          - "Дополнительный штраф 16 алмазов за использование бага."




  - title: "7. Система штрафов"
    items:
      - text: "7.1. Если игрок получил штраф, он обязан оплатить его в течение 1–2 часов (если сумма до двух стаков алмазов), или в течение 16 часов (если сумма превышает два стака)."
        punishment:
          - "При отказе выплачивать — бан."
          - "При наличии уважительной причины срок оплаты штрафа увеличивается."
          - "Если игрок просрочил оплату и отказывается предпринимать меры — бан."
      - text: "7.2. Если игрок уже получал штраф за определенное правило. и повторно его нарушает, сумма Штрафа удваивается."